<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>About Me</title>

<!-- CSS Link -->
<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- Header -->
<header>
    <h1>About Me</h1>
    <p>Welcome to my personal webpage</p>
</header>

<!-- Navigation -->
<nav>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav>

<!-- Main Content -->
<main>

    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>

        <p>
            Hello! My name is Haya Noor. I am a student and
            Full Stack Web Developer. I enjoy learning HTML,
            CSS, JavaScript and building websites.
        </p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Me</h2>

        <form>

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <!-- Reason -->
            <label for="reason">Reason:</label>
            <select id="reason" name="reason">
                <option value="general">General Question</option>
                <option value="work">Work Inquiry</option>
                <option value="feedback">Feedback</option>
            </select>

            <!-- Message -->
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <!-- Submit -->
            <button type="submit">Submit</button>

        </form>
    </section>

</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Haya Noor. All Rights Reserved.</p>
</footer>
```

</body>
</html>
